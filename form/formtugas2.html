<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #3a506b, #1c2541);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-header {
            background-color: #efefef;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .card-header h2 {
            color: #555555;
            font-size: 22px;
            font-weight: bold;
        }
        .card-body {
            padding: 20px 25px;
        }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            color: #1abc9c;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            width: 100%;
            color: #333;
        }

        input::placeholder {
            color: #ccc;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .inline-options {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
            font-size: 13px;
        }

        .inline-options label {
            font-weight: normal;
            color: #333;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .income-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .income-container input[type="range"] {
            flex: 1;
            accent-color: #1abc9c;
        }

        .badge-income {
            background-color: #1abc9c;
            color: white;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: bold;
        }

        input[type="file"] {
            font-size: 12px;
            color: #555;
        }

        .card-footer {
            background-color: #efefef;
            padding: 12px 25px;
            text-align: right;
            border-top: 1px solid #e0e0e0;
        }

        .btn-create {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-create:hover {
            background-color: #16a085;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header">
            <h2>Create Account</h2>
        </div>

        <form>
            <div class="card-body">
                <div class="row">
                    <div class="col">
                        <label>First name *</label>
                        <input type="text" placeholder="enter your first name">
                    </div>
                    <div class="col">
                        <label>Last name</label>
                        <input type="text" placeholder="enter your last name">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Email*</label>
                        <input type="email" placeholder="enter your email">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Password *</label>
                        <input type="password" placeholder="enter your password">
                    </div>
                    <div class="col">
                        <label>Confirm Password *</label>
                        <input type="password" placeholder="enter your password again">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Gender:</label>
                        <div class="inline-options">
                            <label><input type="radio" name="gender" value="male"> Male</label>
                            <label><input type="radio" name="gender" value="female"> Female</label>
                        </div>
                    </div>
                    <div class="col">
                        <label>Hobbies</label>
                        <div class="inline-options">
                            <label><input type="checkbox"> Music</label>
                            <label><input type="checkbox"> Sports</label>
                            <label><input type="checkbox"> Travel</label>
                            <label><input type="checkbox"> Movies</label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Source of Income</label>
                        <select>
                            <option value="employed">Employed</option>
                            <option value="unemployed">Unemployed</option>
                            <option value="student">Student</option>
                        </select>
                    </div>
                    <div class="col">
                        <label>Income</label>
                        <div class="income-container">
                            <input type="range" min="0" max="100" value="20">
                            <span class="badge-income">20K</span>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Upload Profile Picture</label>
                        <input type="file">
                    </div>
                    <div class="col">
                        <label>Age</label>
                        <input type="number" value="18">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label>Bio</label>
                        <textarea></textarea>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <button type="submit" class="btn-create">Create</button>
            </div>
        </form>
    </div>

</body>

</html>
