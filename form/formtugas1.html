<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            background-color: #ffffff; /* Latar belakang layar utama jadi putih */
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 620px;
            margin: 0 auto;
            background-color: #ffe8e8; /* Warna pink hanya ada di dalam kotak form */
            padding: 25px 30px;
            border: 1px solid #dcdcdc; /* Garis tepi tipis */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Efek bayangan halus */
            border-radius: 4px; /* Sudut melengkung halus */
        }

        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            color: #000;
        }

        .form {
            margin-bottom: 8px;
            line-height: 24px;
        }

        .form label {
            display: inline-block;
            width: 145px;
            font-size: 17px;
            vertical-align: middle;
            color: #000;
        }

        .input-container {
            display: inline-block;
            vertical-align: middle;
            white-space: nowrap;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"],
        select,
        textarea {
            font-family: Arial, sans-serif;
            font-size: 12px;
            padding: 2px 3px;
            border: 1px solid #7f7f7f;
            box-sizing: border-box;
            vertical-align: middle;
            display: inline-block;
        }

        .input-container>input[type="text"]:not(.name-input):not(.dob-input):not(.dob-year):not(.country-code),
        input[type="password"],
        input[type="email"],
        select,
        textarea {
            width: 320px;
        }

        .name-input {
            width: 145px !important;
        }

        .dob-input {
            width: 48px !important;
        }

        .dob-year {
            width: 75px !important;
        }

        .dob-format {
            font-style: italic;
            font-size: 16px;
            margin-left: 5px;
        }

        .country-code {
            width: 42px !important;
        }

        .radio-group,
        .checkbox {
            display: inline-block;
            font-size: 17px;
            vertical-align: middle;
        }

        .radio-item,
        .checkbox-item {
            width: auto !important;
            margin-right: 6px;
            font-size: 17px;
        }

        .radio-item input,
        .checkbox-item input {
            vertical-align: -1px;
            margin-right: 2px;
        }

        select {
            height: 22px;
        }

        textarea {
            height: 65px;
            resize: none;
        }

        .btn-container {
            text-align: center;
            margin-top: 20px;
        }

        button[type="submit"] {
            font-family: Arial, sans-serif;
            font-size: 12px;
            padding: 2px 12px;
            background-color: #f0f0f0;
            border: 1px solid #7a7a7a;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Student Registration Form</h1>

        <form>
            <div class="form">
                <label>Roll no. :</label>
                <div class="input-container">
                    <input type="text">
                </div>
            </div>
            <div class="form">
                <label>Student name :</label>
                <div class="input-container">
                    <input type="text" class="name-input" placeholder="First Name">
                    <span>-</span>
                    <input type="text" class="name-input" placeholder="Last Name">
                </div>
            </div>
            <div class="form">
                <label>Father's name :</label>
                <div class="input-container">
                    <input type="text">
                </div>
            </div>
            <div class="form">
                <label>Date of birth :</label>
                <div class="input-container">
                    <input type="text" class="dob-input" placeholder="Day">
                    <span>-</span>
                    <input type="text" class="dob-input" placeholder="Month">
                    <span>-</span>
                    <input type="text" class="dob-year" placeholder="Year">
                    <span class="dob-format">(DD-MM-YYYY)</span>
                </div>
            </div>
            <div class="form">
                <label>Mobile no. :</label>
                <div class="input-container">
                    <input type="text" value="+91" class="country-code">
                    <span>-</span>
                    <input type="text">
                </div>
            </div>
            <div class="form">
                <label>Email id :</label>
                <div class="input-container">
                    <input type="email">
                </div>
            </div>
            <div class="form">
                <label>Password :</label>
                <div class="input-container">
                    <input type="password">
                </div>
            </div>
            <div class="form">
                <label>Gender :</label>
                <div class="radio-group">
                    <label class="radio-item"><input type="radio" name="gender" value="male"> Male</label>
                    <label class="radio-item"><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </div>
            <div class="form">
                <label>Department :</label>
                <div class="checkbox">
                    <label class="checkbox-item"><input type="checkbox" name="dept" value="cse"> CSE</label>
                    <label class="checkbox-item"><input type="checkbox" name="dept" value="it"> IT</label>
                    <label class="checkbox-item"><input type="checkbox" name="dept" value="ece"> ECE</label>
                    <label class="checkbox-item"><input type="checkbox" name="dept" value="civil"> Civil</label>
                    <label class="checkbox-item"><input type="checkbox" name="dept" value="mech"> Mech</label>
                </div>
            </div>
            <div class="form">
                <label>Course :</label>
                <div class="input-container">
                    <select>
                        <option value="">------------------------- Select Current Course's -------------------------
                        </option>
                        <option value="btech">B.Tech</option>
                        <option value="mtech">M.Tech</option>
                        <option value="bca">BCA</option>
                        <option value="mca">MCA</option>
                    </select>
                </div>
            </div>
            <div class="form">
                <label>Student photo :</label>
                <div class="input-container">
                    <input type="file">
                </div>
            </div>
            <div class="form">
                <label>City :</label>
                <div class="input-container">
                    <input type="text">
                </div>
            </div>
            <div class="form">
                <label>Address :</label>
                <div class="input-container">
                    <textarea></textarea>
                </div>
            </div>
            <div class="btn-container">
                <button type="submit">Register</button>
            </div>
        </form>
    </div>
</body>

</html>
